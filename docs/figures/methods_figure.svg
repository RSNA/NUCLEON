<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1040" width="1300" height="1040"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c8c8c"/></marker><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker></defs><rect width="1300" height="1040" fill="#ffffff"/><text x="20" y="34" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#555555" text-anchor="start">Sources</text><line x1="20" y1="46" x2="320" y2="46" stroke="#555555" stroke-width="1.5"/><text x="370" y="34" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#555555" text-anchor="start">Build (scripted, reproducible)</text><line x1="370" y1="46" x2="830" y2="46" stroke="#555555" stroke-width="1.5"/><text x="880" y="34" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#555555" text-anchor="start">Validation</text><line x1="880" y1="46" x2="1280" y2="46" stroke="#555555" stroke-width="1.5"/><rect x="370" y="64" width="460" height="94" rx="6" fill="#f4f4f4" stroke="#8c8c8c" stroke-width="1.2"/><circle cx="394" cy="89" r="13" fill="#1a1a1a"/><text x="394" y="95" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="416" y="95" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">Load ground states</text><text x="384" y="121" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">Half-life in seconds (ħ ln2 / Γ for resonances);</text><text x="384" y="143" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">spin-parity, abundance, decay modes.</text><rect x="370" y="174" width="460" height="94" rx="6" fill="#f4f4f4" stroke="#8c8c8c" stroke-width="1.2"/><circle cx="394" cy="199" r="13" fill="#1a1a1a"/><text x="394" y="205" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="416" y="205" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">Generate isomers</text><text x="384" y="231" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">NUBASE state index → Tc-99m, Lu-177m3 …;</text><text x="384" y="253" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">excitation energy, half-life, decay modes.</text><rect x="370" y="284" width="460" height="138" rx="6" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="2"/><circle cx="394" cy="309" r="13" fill="#1f5fa8"/><text x="394" y="315" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="416" y="315" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">Create decay branches, derive daughters</text><text x="384" y="341" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">One :DecayBranch per decay mode, with its ratio.</text><text x="384" y="363" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1f5fa8" text-anchor="start">Z′ = Z + ΔZ,  A′ = A + ΔA  →  daughter ground state</text><text x="384" y="385" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">No daughter for fission; cluster decay subtracts</text><text x="384" y="407" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">the cluster. 7,399 of 7,691 branches linked.</text><rect x="370" y="438" width="460" height="94" rx="6" fill="#f4f4f4" stroke="#8c8c8c" stroke-width="1.2"/><circle cx="394" cy="463" r="13" fill="#1a1a1a"/><text x="394" y="469" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="416" y="469" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">Add emissions</text><text x="384" y="495" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">Type, energy and yield per decay (≥ 0.1%, ≥ 1 keV)</text><text x="384" y="517" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">for DICOM-coded nuclides and their decay chains.</text><rect x="370" y="548" width="460" height="94" rx="6" fill="#f4f4f4" stroke="#8c8c8c" stroke-width="1.2"/><circle cx="394" cy="573" r="13" fill="#1a1a1a"/><text x="394" y="579" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><text x="416" y="579" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">Map external codes</text><text x="384" y="605" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">skos:exactMatch to OCE and SNOMED CT;</text><text x="384" y="627" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">:dicomCode as in the Radionuclide Code Sequence.</text><rect x="370" y="658" width="460" height="94" rx="6" fill="#f4f4f4" stroke="#8c8c8c" stroke-width="1.2"/><circle cx="394" cy="683" r="13" fill="#1a1a1a"/><text x="394" y="689" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text><text x="416" y="689" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">Mirror values onto classes</text><text x="384" y="715" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">Display copies on each punned class</text><text x="384" y="737" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">(:displayValue) for viewers such as BioPortal.</text><line x1="394" y1="159" x2="394" y2="172" stroke="#8c8c8c" stroke-width="2" marker-end="url(#ah)"/><line x1="394" y1="269" x2="394" y2="282" stroke="#8c8c8c" stroke-width="2" marker-end="url(#ah)"/><line x1="394" y1="423" x2="394" y2="436" stroke="#8c8c8c" stroke-width="2" marker-end="url(#ah)"/><line x1="394" y1="533" x2="394" y2="546" stroke="#8c8c8c" stroke-width="2" marker-end="url(#ah)"/><line x1="394" y1="643" x2="394" y2="656" stroke="#8c8c8c" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="64.0" width="300" height="94" rx="6" fill="#f4f4f4" stroke="#8c8c8c" stroke-width="1.2"/><text x="34" y="95.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">IAEA LiveChart of Nuclides</text><text x="34" y="121.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">ENSDF evaluations; export of</text><text x="34" y="143.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">18 October 2023</text><line x1="322" y1="111.0" x2="367" y2="111.0" stroke="#8c8c8c" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="174.0" width="300" height="94" rx="6" fill="#f4f4f4" stroke="#8c8c8c" stroke-width="1.2"/><text x="34" y="205.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">NUBASE2020</text><text x="34" y="231.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">Kondev et al. 2021;</text><text x="34" y="253.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">2,019 metastable isomers</text><line x1="322" y1="221.0" x2="367" y2="221.0" stroke="#8c8c8c" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="306.0" width="300" height="94" rx="6" fill="#f4f4f4" stroke="#8c8c8c" stroke-width="1.2"/><text x="34" y="337.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">Decay-mode definitions</text><text x="34" y="363.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">ΔZ and ΔA for 32 modes</text><text x="34" y="385.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">(NUBASE2020 notation)</text><line x1="322" y1="353.0" x2="367" y2="353.0" stroke="#1f5fa8" stroke-width="2" marker-end="url(#ahA)"/><rect x="20" y="438.0" width="300" height="94" rx="6" fill="#f4f4f4" stroke="#8c8c8c" stroke-width="1.2"/><text x="34" y="469.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">ICRP Publication 107</text><text x="34" y="495.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">Nuclear decay data for</text><text x="34" y="517.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">dosimetric calculations (2008)</text><line x1="322" y1="485.0" x2="367" y2="485.0" stroke="#8c8c8c" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="548.0" width="300" height="94" rx="6" fill="#f4f4f4" stroke="#8c8c8c" stroke-width="1.2"/><text x="34" y="579.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">IUPAC · OCE · SNOMED CT</text><text x="34" y="605.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">DICOM PS3.16: CID 18,</text><text x="34" y="627.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">CID 4020 (release 2026c)</text><line x1="322" y1="595.0" x2="367" y2="595.0" stroke="#8c8c8c" stroke-width="2" marker-end="url(#ah)"/><rect x="880" y="64" width="400" height="155.5" rx="6" fill="#f4f4f4" stroke="#8c8c8c" stroke-width="1.2"/><text x="894" y="95" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">Internal consistency</text><text x="894" y="121" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">SPARQL checks V1–V6: nucleon conservation,</text><text x="894" y="143" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">A = Z + N, no self-decay, no dangling links,</text><text x="894" y="165" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">element Z, display copies match. HermiT:</text><text x="894" y="187" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">consistent, no unsatisfiable classes.</text><rect x="880" y="235.5" width="400" height="133.5" rx="6" fill="#f4f4f4" stroke="#8c8c8c" stroke-width="1.2"/><text x="894" y="266.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">Daughters vs independent data</text><text x="894" y="292.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">ICRP-107: 1,510 links agree</text><text x="894" y="314.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">ENSDF: 1,688 links agree</text><text x="894" y="336.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1f5fa8" text-anchor="start">0 disagreements</text><rect x="880" y="385.0" width="400" height="111.5" rx="6" fill="#f4f4f4" stroke="#8c8c8c" stroke-width="1.2"/><text x="894" y="416.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">Values vs sources</text><text x="894" y="442.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">IAEA export: 6 documented exceptions</text><text x="894" y="464.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">Gamma lines vs ENSDF: 204 of 206 agree</text><rect x="880" y="512.5" width="400" height="89.5" rx="6" fill="#f4f4f4" stroke="#8c8c8c" stroke-width="1.2"/><text x="894" y="543.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">Manual audit</text><text x="894" y="569.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">Stratified random sample of 100 nuclides</text><rect x="880" y="636" width="400" height="116" rx="6" fill="#f4f4f4" stroke="#8c8c8c" stroke-width="1.2"/><text x="894" y="667" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">Release: NUCLEON.ttl (OWL 2 DL)</text><text x="894" y="693" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">118 elements · 5,408 nuclides (2,019 isomers)</text><text x="894" y="715" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">7,691 decay branches · 3,990 emissions</text><text x="894" y="737" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#555555" text-anchor="start">BioPortal · GitHub: scripts, queries, reports</text><line x1="1080.0" y1="604" x2="1080.0" y2="633" stroke="#8c8c8c" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 836 74 H 850 V 742 H 836" fill="none" stroke="#8c8c8c" stroke-width="2"/><line x1="850" y1="300" x2="877" y2="300" stroke="#8c8c8c" stroke-width="2.5" marker-end="url(#ah)"/><text x="20" y="808" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#555555" text-anchor="start">Worked example: deriving the daughters of Bi-213</text><line x1="20" y1="820" x2="1280" y2="820" stroke="#555555" stroke-width="1.5"/><rect x="45.0" y="870.0" width="190" height="92" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="140" y="904" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Bi-213</text><text x="140" y="928" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Z = 83, A = 213</text><text x="140" y="950" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#555555" text-anchor="middle">t½ 45.59 min</text><rect x="605.0" y="818.0" width="190" height="92" rx="8" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="1.8"/><text x="700" y="852" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Po-213</text><text x="700" y="876" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Z = 84, A = 213</text><text x="700" y="898" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#555555" text-anchor="middle">derived daughter</text><rect x="605.0" y="922.0" width="190" height="92" rx="8" fill="#e8f0fa" stroke="#1f5fa8" stroke-width="1.8"/><text x="700" y="956" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Tl-209</text><text x="700" y="980" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Z = 81, A = 209</text><text x="700" y="1002" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#555555" text-anchor="middle">derived daughter</text><path d="M 235 916 C 300 916, 300 864, 360 864 H 598" fill="none" stroke="#1f5fa8" stroke-width="2.2" marker-end="url(#ahA)"/><text x="380" y="854" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1f5fa8" text-anchor="start">β− decay, 97.86%</text><text x="380" y="884" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">ΔZ = +1, ΔA = 0</text><path d="M 235 916 C 300 916, 300 968, 360 968 H 598" fill="none" stroke="#1f5fa8" stroke-width="2.2" marker-end="url(#ahA)"/><text x="380" y="958" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1f5fa8" text-anchor="start">α decay, 2.14%</text><text x="380" y="988" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">ΔZ = −2, ΔA = −4</text><text x="830" y="886" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">Each daughter is computed from the</text><text x="830" y="908" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">parent's Z and A and the mode's ΔZ and ΔA,</text><text x="830" y="930" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">never transcribed, so every link can be</text><text x="830" y="952" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1a1a1a" text-anchor="start">re-derived and checked (query V1).</text></svg>